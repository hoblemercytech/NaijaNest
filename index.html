<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0B3D2C" />

    <title>BudgetSave — Daily contribution savings</title>
    <meta name="description" content="Contribute cash daily through your collector and track every naira. BudgetSave keeps the record." />
    <link rel="canonical" href="https://www.budgetsaveit.com/" />

    <!-- Open Graph: WhatsApp, Facebook, LinkedIn -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="BudgetSave" />
    <meta property="og:url" content="https://www.budgetsaveit.com/" />
    <meta property="og:title" content="BudgetSave — Daily contribution savings" />
    <meta property="og:description" content="Contribute cash daily through your collector and track every naira. Miss a day, owe nothing." />
    <meta property="og:image" content="https://www.budgetsaveit.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="BudgetSave — your daily savings, written down properly." />
    <meta property="og:locale" content="en_NG" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="BudgetSave — Daily contribution savings" />
    <meta name="twitter:description" content="Contribute cash daily through your collector and track every naira. Miss a day, owe nothing." />
    <meta name="twitter:image" content="https://www.budgetsaveit.com/og-image.png" />

    <!-- Icons -->
    <link rel="icon" type="image/png" href="/favicon.jpg" />
    <link rel="apple-touch-icon" href="/favicon.jpg" />

    <!-- Installable app.
         black-translucent lets the app paint behind the status bar; the shell
         header adds safe-area insets so nothing lands under the notch. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="BudgetSave" />
    <!-- Stops iOS turning member IDs and amounts into blue phone links. -->
    <meta name="format-detection" content="telephone=no" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
